name: Godot validation

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Import and validate project
        run: godot --headless --editor --path . --quit

      - name: Run player smoke tests
        run: godot --headless --path . --script res://tests/player_smoke_test.gd
